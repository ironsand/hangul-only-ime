name: Release

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match the crate version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $crate = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'hangul-tip').version
          if ($tag -ne $crate) { throw "Tag v$tag does not match the hangul-tip version $crate (hangul-tip/Cargo.toml)" }
      - name: Install 32-bit target
        run: rustup target add i686-pc-windows-msvc
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.7.3 -y --no-progress }
      - name: Unit tests
        run: cargo test -p hangul-core
      - name: Build
        run: |
          cargo build --release --locked -p hangul-tip --target x86_64-pc-windows-msvc
          cargo build --release --locked -p hangul-tip --target i686-pc-windows-msvc
      - name: COM smoke test (x64)
        run: cargo run -p smoke -- target\x86_64-pc-windows-msvc\release\hangul_ime.dll
      - name: Release DLLs must not contain the debug keystroke log
        shell: pwsh
        run: |
          foreach ($t in 'x86_64-pc-windows-msvc', 'i686-pc-windows-msvc') {
            $dll = "target\$t\release\hangul_ime.dll"
            if (Select-String -Path $dll -Pattern 'HANGUL_IME_LOG' -SimpleMatch -Quiet) { throw "$dll contains debug log code" }
          }
      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\HangulIME.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $exe = "HangulIME-Setup-$version.exe"
          $h = (Get-FileHash "dist\$exe" -Algorithm SHA256).Hash.ToLower()
          "$h  $exe`n" | Set-Content -NoNewline -Encoding ascii "dist\$exe.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' "dist\HangulIME-Setup-$version.exe" "dist\HangulIME-Setup-$version.exe.sha256" --title '${{ github.ref_name }}' --generate-notes `
            --notes "Install: download and run ``HangulIME-Setup-$version.exe``. See the [Code signing policy](https://github.com/ironsand/hangul-only-ime#code-signing-policy)."
