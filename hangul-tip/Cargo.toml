[package]
name = "hangul-tip"
version = "0.1.2"
license = "MIT"
edition = "2021"
description = "Hangul IME (2-beolsik) text input service"

[lib]
name = "hangul_ime"
crate-type = ["cdylib"]

[dependencies]
hangul-core = { path = "../hangul-core" }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"
